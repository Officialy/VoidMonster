dependencies {
    implementation project(':DragonAPI')
    compileOnly project(':RotaryCraft')
    // Projection regressions use the same math library as Minecraft 26.3.
    testImplementation 'org.joml:joml:1.10.9'
    if (project.hasProperty('voidMonsterWithRotary')) runtimeOnly project(':RotaryCraft')
}

// The root-level files remain pristine upstream references. Modern sources live here.
sourceSets.main.java.srcDirs = ['src/main/java']

neoForge {
    runs {
        clientData { gameDirectory = file('run-client-data') }
        serverData { gameDirectory = file('run-data') }
        gameTest {
            type = 'gameTestServer'
            gameDirectory = file(project.hasProperty('voidMonsterTestDirectory')
                    ? project.property('voidMonsterTestDirectory').toString() : 'run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--tests', project.hasProperty('gameTestSelector')
                    ? project.property('gameTestSelector').toString() : 'voidmonster:*'
        }
    }
}

tasks.named('test', Test) { useJUnitPlatform() }
